name: viroklipz
description: MVP móvil de videos verticales estilo TikTok con Firebase, FCM Push, Supabase, Cloudflare R2, just_audio y efectos overlay.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  uuid: ^4.5.1
  provider: ^6.1.1
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2
  just_audio: ^0.9.40
  http: ^1.2.2
  marquee: ^2.2.3
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  camera: ^0.11.0+2
  dio: ^5.7.0
  gal: ^2.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  device_info_plus: ^10.1.2
  minio: ^3.5.7
  path: ^1.9.0
  qr_flutter: ^4.1.0
  share_plus: ^10.1.0
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true